# Fine-tune Mimi's decoder (Kyutai's Pocket TTS codec) on latents generated by ARDrift trained on Mimi latents (ground-
# truth alignment, "GTA"; docs/MIMI.md): the Mimi counterpart of vocoder_voxcpm2_decoder.yaml. The released decoder
# turns small latent errors into audible noise (UTMOSv2 3.13 -> 2.46 with Gaussian noise of 0.2 std in the normalised
# latent space); here it learns to turn the model's own latents into the recordings. The recipe is BigVGAN-v2's, with
# NVIDIA's released 24 kHz discriminators. Result: no snapshot up to 40k steps beat the released decoder (the best,
# 32.5k: UTMOSv2 2.474 against 2.505 on the 495 held-out utterances); neither did adversarial-only training or
# distillation (train.teacher; docs/MIMI.md).
data:
  root: data/en_mimi_ft     # utterances of data/en_mimi with their 24 kHz audio (audio.bin), docs/MIMI.md
  min_quality: 0
  max_frames: 1500

tts:
  path: runs/ar_en_mimi/model_ema.pt  # ARDrift trained on mimi latents (the backend is stored in the checkpoint)

vocoder:
  backend: mimi
  arch: vae_decoder                 # latent projection, upsampler, transformer and SEANet decoder (released weights)
  weight_norm: false                # Mimi's convolutions were trained without weight norm
  repo: nvidia/bigvgan_v2_24khz_100band_256x
  pretrained_discriminators: true   # released MPD + CQT-D (24 kHz), bigvgan_discriminator_optimizer.pt
  pretrained_optimizer: true        # ... and their AdamW moments (the decoder's optimizer starts fresh)
  hparams: {}                       # discriminator config.json overrides

train:
  seed: 0
  steps: 40000             # as run (docs/MIMI.md): planned for 20k, extended to 40k at 5k
  batch_size: 16           # utterances per batch, one segment each
  batch_frames: 24000
  segment_frames: 8        # Mimi frames (12.5 Hz) per segment: 0.64 s, 15360 samples at 24 kHz
  context_frames: 40       # left context of the causal decoder (3.2 s: within 69 dB of whole-utterance decoding)
  gta_prob: 0.8            # fraction of batches with generated latents (the rest: the recordings' latents)
  gta_temperature: 0.5     # noise temperature of the generated latents (as at inference)
  gta_cfg: 1.0             # an autoregressive model's GTA latents are drawn without guidance
  lr: 5.0e-5               # decoder and discriminators
  lr_decay: 0.99999        # per step
  warmup_steps: 1000       # linear warmup of the decoder's learning rate (its optimizer starts fresh)
  betas: [0.8, 0.99]
  grad_clip: 500.0
  mel_loss_coeff: 15.0     # multi-scale mel L1 at 24 kHz
  disc_warmup_steps: 0
  bf16_disc: false
  num_workers: 3
  log_every: 100
  sample_every: 2500       # TensorBoard audio: GTA / recorded-latent decoding of validation utterances
  num_samples: 2
  save_every: 2500
  keep_snapshots: true     # decoder_ft_<step>.pt: each snapshot is evaluated
